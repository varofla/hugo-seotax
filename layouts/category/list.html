{{ define "content" }}
<article class="content-wrap markdown">
  <div class="list-header list-header--stacked">
    <h1 id="category-title">&nbsp;</h1>
    <p class="list-header-count">
      Total <em class="list-count" id="category-count">&nbsp;</em>
    </p>
  </div>

  <div class="category-no-results hidden" id="category-no-results">
    <p>결과가 없습니다.</p>
  </div>

  <div class="post-list hidden" id="category-results"></div>

  <div id="pagination-anchor"></div>
  <nav class="pagination hidden" id="pagination"></nav>
</article>
{{ end }}
