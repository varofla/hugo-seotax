{{ define "content" }}
<article class="content-wrap browse-page">
  <header class="list-header" id="list-header"></header>
  <div class="search-filter-host" id="search-filter-host"></div>
  <div class="taxonomy-section hidden" id="taxonomy-section"></div>

  <div class="search-data hidden" id="search-data">
    {{- range $index, $page := partialCached "pages/search" . "search" -}}
      <div class="search-item" data-id="{{ $index }}">
        {{ partial "post-item.html" . }}
      </div>
    {{- end -}}
  </div>

  <div class="search-sort-control hidden" id="search-sort-control" role="group" aria-label="검색 결과 정렬">
    <div class="search-sort-options">
      <button class="search-sort-option" type="button" data-sort="relevance" aria-pressed="false">관련도순</button>
      <button class="search-sort-option" type="button" data-sort="newest" aria-pressed="false">최신순</button>
      <button class="search-sort-option" type="button" data-sort="oldest" aria-pressed="false">오래된순</button>
    </div>
  </div>

  <div class="search-no-results hidden" id="search-no-results">
    <h2>일치하는 글이 없습니다.</h2>
    <p>검색어를 바꾸거나 선택한 필터를 줄여보세요.</p>
    <a class="action-link" href="{{ `search/` | relURL }}">검색 초기화 <span aria-hidden="true">↗</span></a>
  </div>

  <div class="post-list hidden" id="search-results"></div>

  <div id="pagination-anchor"></div>
  <nav class="pagination hidden" id="pagination" aria-label="검색 결과 페이지"></nav>
</article>
{{ end }}
