{{- $category1 := .category1 -}}
{{- $category2 := .category2 -}}
{{- $category2Count := .category2Count -}}
{{- $isActive := .isActive -}}
<li
  class="categories-label category-child{{ if $isActive }} is-active{{ end }}"
  data-category-item="child"
  data-category1="{{ $category1 }}"
  data-category1-slug="{{ urlize $category1 }}"
  data-category2="{{ $category2 }}"
  data-category2-slug="{{ urlize $category2 }}">
  <a
    href="{{ printf "%s%s/%s/" (`category/` | relURL) (urlize $category1) (urlize $category2) }}"
    class="category-link">
    <i class="icon-file" aria-hidden="true"></i>
    <span class="category-name">{{- $category2 -}}</span>
    <span class="category-count">{{- $category2Count -}}</span>
  </a>
</li>
