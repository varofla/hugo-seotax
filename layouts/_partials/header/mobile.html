<div class="flex align-center justify-between">
  <label for="menu-control"
        class="menu-toggle-button"
        data-menu-toggle
        aria-label="메뉴 접기/펼치기"
        title="메뉴 접기/펼치기">
    <i class="icon-bars menu-icon" id="menu-icon"></i>
  </label>

  {{ if default true .Site.Params.search.enabled }}
  <div class="mobile-search"
        id="mobile-search-input"
        role="button"
        tabindex="0"
        aria-label="검색">
    <i class="icon-search search-icon"></i>
    <span class="mobile-title">{{ .Site.Title }}</span>
    <i class="mobile-title-pad"></i>
  </div>
  {{ else }}
  <h3>
    <a href="{{ .Site.BaseURL }}" class="mobile-title">{{ .Site.Title }}</a>
  </h3>
  {{ end }}

  <label for="toc-control"
        aria-label="목차 접기/펼치기"
        title="목차 접기/펼치기">
    {{ if partial "toc-show" . }}
    <i class="icon-list menu-icon" id="toc-icon"></i>
    {{ end }}
  </label>
</div>
