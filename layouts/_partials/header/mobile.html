{{- $hasToc := partial "toc-show" . -}}
{{- $locationLabel := .Site.Title -}}
{{- if and (eq .Kind "page") .Title -}}
  {{- $locationLabel = .Title -}}
{{- end -}}
<div class="mobile-header-bar">
  <button type="button"
          class="mobile-header-action menu-toggle-button"
          data-menu-toggle
          aria-controls="site-menu"
          aria-expanded="false"
          aria-label="메뉴 열기"
          title="메뉴 열기">
    <i class="icon-bars menu-icon" id="menu-icon" aria-hidden="true"></i>
  </button>

  {{ if $hasToc }}
  <button type="button"
          class="mobile-location"
          data-toc-toggle
          data-default-label="{{ $locationLabel }}"
          aria-controls="site-toc"
          aria-expanded="false"
          aria-label="목차 열기: {{ $locationLabel }}">
    <span class="mobile-location-label" data-mobile-location>{{ $locationLabel }}</span>
    <i class="icon-chevron-down mobile-location-chevron" aria-hidden="true"></i>
  </button>
  {{ else }}
  <a href="{{ .Site.Home.RelPermalink }}" class="mobile-location mobile-location--link">
    <span class="mobile-location-label">{{ .Site.Title }}</span>
  </a>
  {{ end }}

  {{ if default true .Site.Params.search.enabled }}
  <button type="button"
          class="mobile-header-action mobile-search"
          id="mobile-search-input"
          aria-controls="search-modal"
          aria-expanded="false"
          aria-label="검색 열기"
          title="검색 열기">
    <i class="icon-search search-icon" aria-hidden="true"></i>
  </button>
  {{ else }}
  <span class="mobile-header-action mobile-header-action--placeholder" aria-hidden="true"></span>
  {{ end }}
</div>
