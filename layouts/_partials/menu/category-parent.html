{{- $category1 := .category1 -}}
{{- $category1Count := .category1Count -}}
{{- $hasChildren := .hasChildren -}}
{{- $isLeaf := .isLeaf -}}
{{- $childrenId := .childrenId -}}
<div
  class="category-row category-parent{{ if $isLeaf }} categories-leaf{{ end }}"
  data-category-item="parent"
  data-category1="{{ $category1 }}">
  {{- if $hasChildren -}}
  <button
    type="button"
    class="category-toggle"
    data-category-toggle
    aria-controls="{{ $childrenId }}"
    aria-expanded="false"
    aria-label="{{ $category1 }} 하위 카테고리 펼치기">
    <span class="category-icon category-icon-closed" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
      </svg>
    </span>
    <span class="category-icon category-icon-open" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 19a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4l2 2h4a2 2 0 0 1 2 2v1"></path>
        <path d="M5 19h14a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2z"></path>
      </svg>
    </span>
  </button>
  {{- else -}}
  <span class="category-icon category-icon-leaf" aria-hidden="true">
    <i class="icon-file"></i>
  </span>
  {{- end -}}
  <a
    href="{{ `search/` | relURL }}?category1={{ $category1 }}"
    class="category-link category-row-link">
    <span class="category-name">{{- $category1 -}}</span>
  </a>
</div>
